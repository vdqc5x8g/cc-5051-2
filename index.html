<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>升降通路 · 时间相关导航原型</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">⇅</span>
        <div>
          <h1>升降通路 · 时间相关导航</h1>
          <p class="sub">平台周期到站 · 闸门定时开启 · 角色步行 / 等待 / 搭乘统一时间线</p>
        </div>
      </div>
      <div class="transport">
        <button id="btn-play" class="primary" aria-label="播放或暂停">▶ 播放</button>
        <button id="btn-step" class="ghost" title="前进 1 秒">+1s</button>
        <div class="speed">
          <label for="speed">倍速</label>
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
        </div>
        <div class="clockbox">
          <span class="lbl">内核时刻</span>
          <strong id="clock">0:00.0</strong>
        </div>
        <button id="btn-reset" class="ghost">重置</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage">
        <div id="scene" class="scene"></div>
        <div class="overlay-top">
          <div class="now-card">
            <span class="tag" id="now-kind">等待开始</span>
            <span id="now-detail">正在读取内核日程…</span>
          </div>
          <div class="wait-card" id="wait-card" hidden>
            <span class="pulse"></span>
            <div>
              <span class="lbl">等待原因</span>
              <p id="wait-reason"></p>
            </div>
          </div>
        </div>
        <div class="overlay-bottom">
          <div class="deviation" id="deviation">
            <span class="lbl">实际到达偏差</span>
            <strong id="dev-value">—</strong>
            <span id="dev-note" class="muted">尚未到达</span>
          </div>
          <div class="legend">
            <span><i class="dot cyan"></i>A 平台</span>
            <span><i class="dot amber"></i>B 平台</span>
            <span><i class="dot green"></i>安全可站区</span>
            <span><i class="dot orange"></i>固定距离路线</span>
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>

      <aside class="panel">
        <section class="card">
          <h2>行程设置 <span class="kernel-badge">内核驱动</span></h2>
          <div class="row two">
            <label>出发层
              <select id="start-deck"></select>
            </label>
            <label>目的层
              <select id="goal-deck"></select>
            </label>
          </div>
          <label class="row">出发时刻
            <input id="start-time" type="number" step="0.1" value="0" />
            <span class="hint">秒（相对内核时钟）</span>
          </label>
          <div class="row actions">
            <button id="btn-apply" class="primary">重新规划</button>
            <button id="btn-missed" class="ghost" title="把出发时刻设到刚发车之后">刚错过班次</button>
          </div>
          <p class="note" id="kernel-note">目的层选项由平台停站表生成，不可选未停靠层。</p>
        </section>

        <section class="card">
          <h2>班次调整</h2>
          <div id="lifts"></div>
        </section>

        <section class="card">
          <h2>电梯服务状态</h2>
          <div id="closures" class="closures"></div>
          <p class="note">关闭某层服务会立即写回升降通路内核；规划器视界内无法到达时，结果区会给出不可达原因与恢复时刻。</p>
        </section>

        <section class="card">
          <h2>验收场景</h2>
          <div class="scenario-list">
            <button data-scenario="missed" class="scenario">刚错过班次<small>下一班到站前在安全区等待</small></button>
            <button data-scenario="tradeoff" class="scenario">距离近但到达慢<small>固定距离路线 vs 最早可达</small></button>
            <button data-scenario="unreachable" class="scenario">目的层暂不可达<small>服务中断 + 视界内无解</small></button>
            <button data-scenario="compare" class="scenario">与穷举参考比较<small>小图枚举最早到达</small></button>
          </div>
        </section>

        <section class="card">
          <h2>导航结果 <span id="result-status" class="pill">—</span></h2>
          <div id="summary" class="summary"></div>
          <ol id="steps" class="steps"></ol>
          <div id="failure" class="failure" hidden></div>
        </section>

        <section class="card">
          <h2>当前日程 <span class="muted small">未来 3 分钟</span></h2>
          <div id="timetable" class="timetable"></div>
        </section>

        <section class="card">
          <h2>诊断</h2>
          <div id="diagnostics" class="diagnostics"></div>
        </section>
      </aside>
    </main>

    <script type="module" src="/src/ui/main.js"></script>
  </body>
</html>
